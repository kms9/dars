version: 2

project_name: dars

builds:
  - id: dars
    main: ./cmd/dars
    dir: server
    binary: dars
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Unversioned archive kept as a secondary asset for bootstrap clients that
  # request `dars_{os}_{arch}.{ext}`.
  - id: legacy
    files:
      - LICENSE*
      - README*
      - NOTICE
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  # Versioned archive name used by current CLI / install scripts /
  # desktop bootstrap going forward.
  - id: versioned
    files:
      - LICENSE*
      - README*
      - NOTICE
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: dars
    ids:
      - versioned
    repository:
      owner: kms9
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/kms9/dars"
    description: "DARS CLI — local agent runtime and management tool for the DARS platform"
    # No license stanza: DARS ships under the Multica License (Apache 2.0
    # terms with additional conditions, see LICENSE), which has no SPDX
    # identifier, so declaring "Apache-2.0" here would be a false claim.
    install: |
      bin.install "dars"
    test: |
      system "#{bin}/dars", "version"
